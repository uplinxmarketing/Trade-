[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[build.args]
CACHE_BUST = "2026-05-05T21:12:42Z"

[deploy]
restartPolicyType = "always"
healthcheckPath   = "/api/ping"
healthcheckTimeout = 300

# Persistent volume — keeps bot.db (trades, positions, candles) and
# strategy.json (approved coins, budget settings) across deploys.
# Without this, all open positions and trade history are lost on every update.
[[volumes]]
mountPath = "/data"
